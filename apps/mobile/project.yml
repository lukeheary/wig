name: WIG
options:
  minimumXcodeGenVersion: 2.38.0
settings:
  base:
    SWIFT_VERSION: 5.10
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    TARGETED_DEVICE_FAMILY: 1
configs:
  Debug: debug
  ProdLocal: debug
  Release: release
packages:
  Clerk:
    url: https://github.com/clerk/clerk-ios
    from: 1.0.0
schemes:
  WIG:
    build:
      targets:
        WIG: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  WIG Dev:
    build:
      targets:
        WIG: all
    run:
      config: Debug
      environmentVariables:
        CLERK_PUBLISHABLE_KEY: pk_test_cG9saXNoZWQtYmF0LTQuY2xlcmsuYWNjb3VudHMuZGV2JA
        CLERK_FRONTEND_API: polished-bat-4.clerk.accounts.dev
        API_BASE_URL: https://doe-striking-duckling.ngrok-free.app
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  WIG Prod Local:
    build:
      targets:
        WIG: all
    run:
      config: ProdLocal
      environmentVariables:
        CLERK_PUBLISHABLE_KEY: pk_live_Y2xlcmsud2hvaXNnb2luZy5jb20k
        CLERK_FRONTEND_API: clerk.whoisgoing.com
        API_BASE_URL: https://api.whoisgoing.com
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
targets:
  WIG:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: WIG
    configFiles:
      Debug: Config/Debug.xcconfig
      ProdLocal: Config/ProdLocal.xcconfig
      Release: Config/Release.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.whoisgoing.app
        PRODUCT_NAME: WIG
        INFOPLIST_FILE: WIG/Support/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Who Is Going
        CODE_SIGN_ENTITLEMENTS: WIG/Support/WIG.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CURRENT_PROJECT_VERSION: 22
        MARKETING_VERSION: 1.0.6
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO
      configs:
        Debug:
          base:
            APS_ENVIRONMENT: development
            CODE_SIGN_STYLE: Automatic
        ProdLocal:
          base:
            APS_ENVIRONMENT: development
            CODE_SIGN_STYLE: Automatic
        Release:
          base:
            APS_ENVIRONMENT: production
            CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: Clerk
        product: ClerkKit
      - package: Clerk
        product: ClerkKitUI
