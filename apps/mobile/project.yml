name: WIG
options:
  minimumXcodeGenVersion: 2.38.0
settings:
  base:
    SWIFT_VERSION: 5.10
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    TARGETED_DEVICE_FAMILY: 1
    DEVELOPMENT_TEAM: ""
configs:
  Debug: debug
  Release: release
packages:
  Clerk:
    url: https://github.com/clerk/clerk-ios
    from: 1.0.0
targets:
  WIG:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: WIG
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.whoisgoing.app
        PRODUCT_NAME: WIG
        INFOPLIST_FILE: WIG/Support/Info.plist
        CODE_SIGN_ENTITLEMENTS: WIG/Support/WIG.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        Debug:
          base:
            APS_ENVIRONMENT: development
            CODE_SIGN_STYLE: Automatic
          configFiles:
            - Config/Debug.xcconfig
        Release:
          base:
            APS_ENVIRONMENT: production
            CODE_SIGN_STYLE: Automatic
          configFiles:
            - Config/Release.xcconfig
    dependencies:
      - package: Clerk
        product: ClerkKit
      - package: Clerk
        product: ClerkKitUI
